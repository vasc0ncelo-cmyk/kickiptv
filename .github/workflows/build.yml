name: Build PKG
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      DOTNET_ROLL_FORWARD: Major
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir nome de pasta com caractere invisivel (src)
        run: |
          # Pelo celular e facil criar a pasta com um caractere INVISIVEL na frente do nome (ex.: U+2060): na tela parece "src",
          # mas para o computador e outra pasta e o build nao acha nenhum arquivo. Aqui renomeia para o nome certo e grava a correcao.
          fixed=0
          for d in */; do
            d="${d%/}"
            clean=$(printf '%s' "$d" | LC_ALL=C tr -cd '\040-\176')
            if [ "$clean" != "$d" ] && [ -n "$clean" ]; then
              echo "Pasta com caractere invisivel no nome: '$clean' (bytes: $(printf '%s' "$d" | od -An -tx1 | head -1))"
              if [ -e "$clean" ]; then cp -rf "$d"/. "$clean"/ && rm -rf "$d"; else mv "$d" "$clean"; fi
              fixed=1
            fi
          done
          if [ "$fixed" = 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Corrige o nome da pasta (tinha um caractere invisivel) [skip ci]" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "AVISO: nao consegui gravar a correcao no repositorio; o build segue com a pasta corrigida so nesta execucao"
          fi
      - name: Dependencias
        # O espelho de pacotes do Ubuntu as vezes some do DNS por alguns minutos ("Temporary failure resolving azure.archive.ubuntu.com").
        # Entao: so instala o que falta e tenta de novo (ate 5 vezes) antes de desistir.
        run: |
          need=""
          command -v clang++ >/dev/null || need="$need clang"
          command -v ld.lld  >/dev/null || need="$need lld"
          command -v unzip   >/dev/null || need="$need unzip"
          if [ -z "$need" ]; then
            echo "clang, lld e unzip ja estao no runner: nada para instalar"
          else
            ok=0
            for i in 1 2 3 4 5; do
              if sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y -o Acquire::Retries=3 $need; then ok=1; break; fi
              echo "apt falhou (tentativa $i de 5); esperando para tentar de novo"
              sleep $((i * 20))
            done
            [ "$ok" = 1 ] || { echo "nao consegui instalar:$need"; exit 1; }
          fi
          clang++ --version | head -1; ld.lld --version | head -1
      - name: Testes da logica (PC)
        run: |
          g++ -std=c++17 -o t tests/test_app.cpp src/m3u.cpp && ./t
          g++ -std=c++17 -o u tests/test_ui.cpp src/m3u.cpp && ./u
          g++ -std=c++17 -o m tests/test_m3u.cpp src/m3u.cpp && ./m
          g++ -std=c++17 -pthread -o n tests/test_netstream.cpp && ./n
          g++ -std=c++17 -o r tests/test_render.cpp && ./r
          g++ -std=c++17 -pthread -o h tests/test_hls.cpp && ./h
          g++ -std=c++17 -pthread -o b tests/test_blit.cpp && ./b
          g++ -std=c++17 -o p tests/test_padin.cpp && ./p
          g++ -std=c++17 -o k tests/test_keyboard.cpp src/m3u.cpp && ./k
          g++ -std=c++17 -o c tests/test_classify.cpp src/m3u.cpp && ./c
          g++ -std=c++17 -o w tests/test_urlutil.cpp && ./w
          g++ -std=c++17 -pthread -o ic tests/test_imgcache.cpp src/imgcache.cpp && ./ic
          g++ -std=c++17 -pthread -o f tests/test_httpfile.cpp && ./f
          g++ -std=c++17 -pthread -o pf tests/test_progfile.cpp && ./pf
          g++ -std=c++17 -o s tests/test_tschunk.cpp && ./s
          g++ -std=c++17 -pthread -o l tests/test_listload.cpp src/m3u.cpp && ./l
          g++ -std=c++17 -o dt tests/test_detail.cpp src/m3u.cpp && ./dt
          g++ -std=c++17 -pthread -o xt tests/test_xtream.cpp src/m3u.cpp && ./xt
          g++ -std=c++17 -o jt tests/test_json.cpp && ./jt
          g++ -std=c++17 -o qr tests/test_qrcode.cpp && ./qr
          g++ -std=c++17 -o lb tests/test_livebuf.cpp && ./lb
          g++ -std=c++17 -o ho tests/test_hero.cpp src/m3u.cpp && ./ho
      - name: Lista padrao do app (segredo LIST_URL, opcional)
        env:
          LIST_URL: ${{ secrets.LIST_URL }}
        run: |
          if [ -n "$LIST_URL" ]; then
            printf 'static const char *kSecretListUrl = R"KICKURL(%s)KICKURL";\n' "$LIST_URL" > src/defaultlist_secret.hpp
            echo "lista padrao: vem do segredo LIST_URL (nao fica no codigo do repositorio)"
          else
            echo "sem segredo LIST_URL: vale o endereco de src/defaultlist.hpp"
          fi
      - name: Chave do TMDB para as logos (segredo TMDB_KEY, opcional)
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: |
          if [ -n "$TMDB_KEY" ]; then
            printf 'static const char *kSecretTmdbKey = R"TMDBK(%s)TMDBK";\n' "$TMDB_KEY" > src/tmdbkey_secret.hpp
            echo "logos: chave TMDB vem do segredo TMDB_KEY"
          else
            echo "sem segredo TMDB_KEY: o carrossel mostra o titulo em texto"
          fi
      - name: Toolchain OpenOrbis
        run: bash scripts/get_toolchain.sh
      - name: Icone e fundo do app (nao quebra o build se falhar)
        run: |
          rm -f sce_sys/pic0.png sce_sys/pic1.png
          pip install pillow || true
          python3 scripts/make_icon.py || echo "icone padrao mantido"
          rm -f sce_sys/pic0.png sce_sys/pic1.png
          ls -la sce_sys
      - name: Compilar PKG
        run: |
          make TITLE="Kick IPTV"
          mv build/*.pkg build/Kick-IPTV.pkg
      - name: Conferir o PKG
        run: |
          ls -l build/*.pkg
          sha256sum build/*.pkg
          head -c 4 build/*.pkg | xxd || true
      - name: Publicar PKG numa Release (baixa o .pkg direto, sem zip)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kick IPTV - build ${{ github.run_number }}
          files: build/*.pkg
          make_latest: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kickiptv-pkg
          path: |
            build/*.pkg
            build/eboot.bin
