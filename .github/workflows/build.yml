name: Build PKG
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      DOTNET_ROLL_FORWARD: Major
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: sudo apt-get update && sudo apt-get install -y clang lld unzip
      - name: Testes da logica (PC)
        run: |
          g++ -std=c++17 -o t tests/test_app.cpp src/m3u.cpp && ./t
          g++ -std=c++17 -o u tests/test_ui.cpp src/m3u.cpp && ./u
          g++ -std=c++17 -o m tests/test_m3u.cpp src/m3u.cpp && ./m
          g++ -std=c++17 -pthread -o n tests/test_netstream.cpp && ./n
          g++ -std=c++17 -o r tests/test_render.cpp && ./r
          g++ -std=c++17 -pthread -o h tests/test_hls.cpp && ./h
          g++ -std=c++17 -pthread -o b tests/test_blit.cpp && ./b
          g++ -std=c++17 -o p tests/test_padin.cpp && ./p
          g++ -std=c++17 -o k tests/test_keyboard.cpp src/m3u.cpp && ./k
          g++ -std=c++17 -o c tests/test_classify.cpp src/m3u.cpp && ./c
          g++ -std=c++17 -o w tests/test_urlutil.cpp && ./w
          g++ -std=c++17 -pthread -o f tests/test_httpfile.cpp && ./f
          g++ -std=c++17 -o s tests/test_tschunk.cpp && ./s
          g++ -std=c++17 -pthread -o l tests/test_listload.cpp src/m3u.cpp && ./l
      - name: Toolchain OpenOrbis
        run: bash scripts/get_toolchain.sh
      - name: Icone e fundo do app (nao quebra o build se falhar)
        run: |
          rm -f sce_sys/pic0.png sce_sys/pic1.png
          pip install pillow || true
          python3 scripts/make_icon.py || echo "icone padrao mantido"
          rm -f sce_sys/pic0.png sce_sys/pic1.png
          ls -la sce_sys
      - name: Compilar PKG
        run: make TITLE="Kick IPTV ${{ github.run_number }}"
      - name: Conferir o PKG
        run: |
          ls -l build/*.pkg
          sha256sum build/*.pkg
          head -c 4 build/*.pkg | xxd || true
      - name: Publicar PKG numa Release (baixa o .pkg direto, sem zip)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kick IPTV - build ${{ github.run_number }}
          files: build/*.pkg
          make_latest: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kickiptv-pkg
          path: |
            build/*.pkg
            build/eboot.bin
